function recordAudit(action,target){audit.unshift({date:new Date().toLocaleString(),actor:role,action,target})}
function toggleMenu(){document.getElementById("sidebar").classList.toggle("open");document.getElementById("scrim").classList.toggle("show")}
function setPage(p){page=p;filter="all";query="";render();document.getElementById("sidebar").classList.remove("open");document.getElementById("scrim").classList.remove("show")}
function renderNav(){document.getElementById("nav").innerHTML=navItems.map(([k,ic])=>'<button class="'+(page===k?'active':'')+'" onclick="setPage(\''+k+'\')"><span class="ico">'+ic+'</span><span>'+t(k)+'</span></button>').join("")}
function render(){document.documentElement.lang=lang;document.getElementById("language").value=lang;document.getElementById("roleSelect").value=role;document.getElementById("topTitle").textContent=t(page);document.getElementById("rolePill").textContent=role.toUpperCase()+" ACCESS";document.getElementById("userName").textContent=role==="Admin"?"Administrator":role;document.getElementById("userRole").textContent=role;document.getElementById("avatar").textContent=role[0];document.getElementById("footer").textContent=(lang==="rw"?"Byakozwe na Remy, Divin, Mireille na L5ideas":lang==="fr"?"Réalisé par Remy, Divin, Mireille et L5ideas":"By Remy, Divin, Mireille and L5ideas")+" · UBUBIKO SMART";renderNav();document.getElementById("content").classList.remove("fade-language");void document.getElementById("content").offsetWidth;document.getElementById("content").classList.add("fade-language");document.getElementById("content").innerHTML=page==="dashboard"?dashboard():page==="products"?productPage():page==="movements"?movementPage():page==="requests"?requestPage():page==="returns"?simplePage("returns","↩"):page==="users"?usersPage():page==="audit"?auditPage():page==="assistant"?assistantPage():page==="suppliers"?simplePage("suppliers","♧"):page==="customers"?simplePage("customers","♧"):page==="reports"?reportsPage():settingsPage();document.querySelectorAll("[data-i18n]").forEach(el=>{let key=el.dataset.i18n;if(T[lang][key])el.textContent=t(key)})}
function head(title,desc,actions=""){return '<div class="page-head"><div><div class="eyebrow">UBUBIKO SMART / '+t("workspace")+'</div><h1>'+title+'</h1><p>'+desc+'</p></div><div class="head-actions">'+actions+'</div></div>'}
function dashboard(){let total=products.reduce((a,p)=>a+p.qty,0),value=products.reduce((a,p)=>a+p.qty*p.price,0),low=products.filter(p=>p.qty<=p.min).length;return head(t("welcome"),t("overview"),'<button class="btn" onclick="exportReport()">↧ '+t("export")+'</button><button class="btn btn-gold" onclick="openProductModal()">＋ '+t("addProduct")+'</button>')+
'<div class="stats"><div class="stat"><div class="stat-top">'+t("totalProducts")+'<span class="stat-icon">▣</span></div><strong>'+products.length+'</strong><small class="positive">↑ 4.8% '+t("fromLast")+'</small></div><div class="stat"><div class="stat-top">'+t("stockValue")+'<span class="stat-icon">◈</span></div><strong>'+fmt(value)+' <small>RWF</small></strong><small>'+t("totalValue")+'</small></div><div class="stat"><div class="stat-top">'+t("sales")+'<span class="stat-icon">↗</span></div><strong>248</strong><small class="positive">↑ 8.2% '+t("fromLast")+'</small></div><div class="stat"><div class="stat-top">'+t("lowStock")+'<span class="stat-icon">⚑</span></div><strong>'+low+'</strong><small>'+t("lowAlerts")+'</small></div></div>'+
'<div class="panels"><div><div class="panel"><div class="panel-head"><h3>'+t("stockOverview")+'</h3><small>'+t("last7")+'</small></div><div class="panel-body"><div class="bar-chart">'+[42,65,52,82,58,94,73].map((v,i)=>'<div class="bar-col"><div class="bar" style="height:'+v+'%"></div><small>'+["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][i]+'</small></div>').join("")+'</div></div><div class="panel"><div class="panel-head"><h3>'+t("recentActivity")+'</h3><button class="btn" onclick="setPage(\'movements\')">'+t("viewAll")+'</button></div>'+movementTable(movements.slice(0,4))+'</div></div><div><div class="panel"><div class="panel-head"><h3>'+t("lowAlerts")+'</h3><button class="btn" onclick="setPage(\'products\')">'+t("viewAll")+'</button></div><div class="panel-body"><div class="alert-list">'+products.filter(p=>p.qty<=p.min).map(p=>'<div class="alert"><div><b>'+p.icon+' '+p.name+'</b><small>'+p.qty+' / '+p.min+' '+t("units")+'</small></div><span class="alert-num">'+(p.qty===0?t("out"):t("low"))+'</span></div>').join("")+'</div></div></div><div class="panel"><div class="panel-head"><h3>'+t("quickActions")+'</h3></div><div class="panel-body"><div class="quick-grid"><button class="quick" onclick="openRequestModal()"><span>⇧</span><b>'+t("newRequest")+'</b><small>'+t("request")+'</small></button><button class="quick" onclick="openMovementModal()"><span>⇩</span><b>'+t("receiveStock")+'</b><small>'+t("stockIn")+'</small></button><button class="quick" onclick="openMovementModal(true)"><span>↗</span><b>'+t("recordSale")+'</b><small>'+t("stockOut")+'</small></button><button class="quick" onclick="setPage(\'reports\')"><span>▥</span><b>'+t("reports")+'</b><small>'+t("export")+'</small></button></div></div></div></div></div>'}
function productPage(){if(!allowed("products"))return denied();let rows=products.filter(p=>(filter==="all"||filter==="low"&&p.qty<=p.min||filter==="available"&&p.qty>p.min&&p.qty>0||filter==="out"&&p.qty===0)&&(!query||p.name.toLowerCase().includes(query.toLowerCase())||p.sku.toLowerCase().includes(query.toLowerCase())));let body=rows.map(p=>'<tr><td><div class="product"><div class="product-icon">'+p.icon+'</div><div><b>'+p.name+'</b><small>'+p.id+'</small></div></div></td><td>'+p.sku+'</td><td>'+p.category+'</td><td><b>'+p.qty+'</b></td><td>'+fmt(p.price)+' RWF</td><td>'+stockStatus(p)+'</td><td>'+(allowed("products","u")?'<button class="btn" onclick="editProduct('+p.id+')">✎</button>':'—')+'</td></tr>').join("");if(!body)body='<tr><td colspan="7" class="empty">'+t("noRecords")+'</td></tr>';return head(t("products"),t("moduleInfo"),allowed("products","c")?'<button class="btn btn-gold" onclick="openProductModal()">＋ '+t("addProduct")+'</button>':'')+'<div class="panel"><div class="panel-head"><div class="toolbar"><input class="search" placeholder="'+t("search")+'" value="'+query.replace(/"/g,"&quot;")+'" oninput="query=this.value;render()"><select class="select" onchange="filter=this.value;render()"><option value="all">'+t("all")+'</option><option value="available">'+t("available")+'</option><option value="low">'+t("low")+'</option><option value="out">'+t("out")+'</option></select></div><small>'+rows.length+' '+t("product")+'</small></div><div class="table-wrap"><table><thead><tr><th>'+t("product")+'</th><th>SKU</th><th>'+t("category")+'</th><th>'+t("quantity")+'</th><th>'+t("price")+'</th><th>'+t("status")+'</th><th>'+t("action")+'</th></tr></thead><tbody>'+body+'</tbody></table></div></div>'}
function stockStatus(p){return p.qty===0?'<span class="status danger">'+t("out")+'</span>':p.qty<=p.min?'<span class="status warn">'+t("low")+'</span>':'<span class="status">'+t("available")+'</span>'}
function movementTable(rows){return '<div class="table-wrap"><table><thead><tr><th>'+t("reference")+'</th><th>'+t("product")+'</th><th>'+t("type")+'</th><th>'+t("quantity")+'</th><th>'+t("date")+'</th><th>'+t("role")+'</th></tr></thead><tbody>'+rows.map(m=>'<tr><td><b>'+m.id+'</b></td><td>'+m.product+'</td><td><span class="status '+(m.type==="stockOut"?"warn":"")+'">'+t(m.type)+'</span></td><td>'+m.qty+'</td><td>'+m.date+'</td><td>'+m.by+'</td></tr>').join("")+'</tbody></table></div>'}
function movementPage(){if(!allowed("movements"))return denied();return head(t("movements"),t("moduleInfo"),allowed("movements","c")?'<button class="btn btn-gold" onclick="openMovementModal()">＋ '+t("receiveStock")+'</button>':'')+'<div class="panel">'+movementTable(movements)+'</div>'}
function requestPage(){if(!allowed("requests"))return denied();return head(t("requests"),t("moduleInfo"),allowed("requests","c")?'<button class="btn btn-gold" onclick="openRequestModal()">＋ '+t("newRequest")+'</button>':'')+'<div class="panel"><div class="table-wrap"><table><thead><tr><th>'+t("reference")+'</th><th>'+t("product")+'</th><th>'+t("quantity")+'</th><th>'+t("status")+'</th><th>'+t("role")+'</th><th>'+t("action")+'</th></tr></thead><tbody>'+requests.map(r=>'<tr><td><b>'+r.id+'</b></td><td>'+r.product+'</td><td>'+r.qty+'</td><td>'+requestStatus(r.status)+'</td><td>'+r.by+'</td><td>'+(r.status==="pending"&&(role==="Admin"||role==="Manager")?'<button class="btn" onclick="approveRequest(\''+r.id+'\')">'+t("approved")+'</button>':'—')+'</td></tr>').join("")+'</tbody></table></div></div>'}
function requestStatus(s){return '<span class="status '+(s==="pending"?"warn":s==="rejected"?"danger":s==="approved"?"info":"")+'">'+t(s)+'</span>'}
function simplePage(module,icon){if(!allowed(module))return denied();let title=t(module);return head(title,t("moduleInfo"),'<button class="btn btn-gold" onclick="notify(t(\'saved\'))">＋ '+t("add")+'</button>')+'<div class="module-grid">'+[[icon,title,t("access")],[ "▤",t("recentActivity"),t("recent")],[ "✓",t("status"),t("available")]].map(x=>'<div class="module-card"><span>'+x[0]+'</span><h4>'+x[1]+'</h4><p>'+x[2]+'</p></div>').join("")+'</div>'}
function usersPage(){if(role!=="Admin")return denied(true);return head(t("usersTitle"),t("moduleInfo"))+'<div class="panel"><div class="panel-head"><h3>'+t("permissions")+'</h3><span class="permission">DEFAULT DENY</span></div><div class="table-wrap"><table><thead><tr><th>'+t("role")+'</th>'+navItems.map(n=>'<th>'+t(n[0])+'</th>').join("")+'</tr></thead><tbody>'+Object.entries(permissions).map(([r,mods])=>'<tr><td><b>'+r+'</b></td>'+navItems.map(n=>'<td>'+ (mods[n[0]]==="crud"?'<span class="status">CRUD</span>':mods[n[0]]==="-"?'<span class="status danger">—</span>':'<span class="status info">'+mods[n[0]].toUpperCase()+'</span>')+'</td>').join("")+'</tr>').join("")+'</tbody></table></div><div class="panel-body"><small>Admin: full access · Manager: operational approvals · Cashier: sales and own customer records · Storekeeper: stock handling. Backend enforcement is required for production.</small></div></div>'}
function auditPage(){if(role!=="Admin"&&role!=="Manager")return denied(true);return head(t("auditTitle"),t("moduleInfo"))+'<div class="panel"><div class="table-wrap"><table><thead><tr><th>'+t("date")+'</th><th>'+t("role")+'</th><th>'+t("action")+'</th><th>'+t("reference")+'</th></tr></thead><tbody>'+audit.map(a=>'<tr><td>'+a.date+'</td><td>'+a.actor+'</td><td>'+a.action+'</td><td>'+a.target+'</td></tr>').join("")+'</tbody></table></div><div class="panel-body"><span class="status">APPEND ONLY</span> <small>Audit records cannot be edited or deleted from this interface.</small></div></div>'}
function assistantPage(){if(!allowed("assistant"))return denied();return head(t("assistant"),t("moduleInfo"))+'<div class="panel"><div class="panel-body" style="min-height:260px"><div class="alert"><div><b>✧ UBUBIKO SMART AI</b><small>'+t("assistantIntro")+'</small></div><span class="status">ONLINE DEMO</span></div><div id="chatLog" style="padding:18px 2px;color:#53617a">'+t("assistantIntro")+'</div><div class="toolbar"><input class="search" id="chatInput" style="flex:1" placeholder="'+t("ask")+'"><button class="btn btn-primary" onclick="askAssistant()">'+t("send")+'</button></div></div></div>'}
function askAssistant(){let el=document.getElementById("chatInput"),q=el.value.trim();if(!q)return;let low=products.filter(p=>p.qty<=p.min);let ans=lang==="rw"?"Dufite ibicuruzwa "+products.length+". Ibicuruzwa bike ni "+low.map(p=>p.name+" ("+p.qty+")").join(", ")+".":lang==="fr"?"Nous avons "+products.length+" produits. Articles en stock faible : "+low.map(p=>p.name+" ("+p.qty+")").join(", ")+".":"We have "+products.length+" products. Low-stock items: "+low.map(p=>p.name+" ("+p.qty+")").join(", ")+".";
document.getElementById("chatLog").innerHTML+='<p><b>'+role+':</b> '+q.replace(/</g,"&lt;")+'</p><p><b>✧ UBUBIKO AI:</b> '+ans+'</p>';el.value=""}
function reportsPage(){if(!allowed("reports"))return denied();let val=products.reduce((a,p)=>a+p.qty*p.price,0);return head(t("reports"),t("moduleInfo"),'<button class="btn btn-gold" onclick="exportReport()">↧ '+t("export")+'</button>')+'<div class="stats"><div class="stat"><div class="stat-top">'+t("totalProducts")+'</div><strong>'+products.length+'</strong></div><div class="stat"><div class="stat-top">'+t("totalValue")+'</div><strong>'+fmt(val)+' RWF</strong></div><div class="stat"><div class="stat-top">'+t("lowStock")+'</div><strong>'+products.filter(p=>p.qty<=p.min).length+'</strong></div><div class="stat"><div class="stat-top">'+t("movements")+'</div><strong>'+movements.length+'</strong></div></div><div class="panel"><div class="panel-head"><h3>'+t("stockOverview")+'</h3></div>'+movementTable(movements)+'</div>'}
function settingsPage(){return head(t("settingsTitle"),t("moduleInfo"))+'<div class="panels"><div class="panel"><div class="panel-head"><h3>'+t("personalSettings")+'</h3></div><div class="panel-body"><div class="field"><label>'+t("language")+'</label><select class="select" style="width:100%" onchange="changeLang(this.value)"><option value="rw" '+(lang==="rw"?"selected":"")+'>'+T.rw.language+'</option><option value="en" '+(lang==="en"?"selected":"")+'>'+T.en.language+'</option><option value="fr" '+(lang==="fr"?"selected":"")+'>'+T.fr.language+'</option></select></div><div class="field"><label>'+t("theme")+'</label><span class="status info">Navy · White · Gold</span></div></div></div><div class="panel"><div class="panel-head"><h3>'+t("systemSettings")+'</h3></div><div class="panel-body"><p>'+t("adminOnly")+'</p><span class="permission">DEFAULT DENY</span></div></div></div>'}
function denied(admin=false){return head(t(page),t("moduleInfo"))+'<div class="panel"><div class="panel-body empty"><div style="font-size:32px">🔒</div><h3>'+t("noPermission")+'</h3><p>'+t("denied")+'</p>'+(admin?'<span class="permission">ADMIN ONLY</span>':'')+'</div></div>'}
function changeLang(v){lang=v;render()}
document.getElementById("language").addEventListener("change",e=>changeLang(e.target.value));
document.getElementById("roleSelect").addEventListener("change",e=>{role=e.target.value;recordAudit("Role switched (demo)",role);render();notify(t("welcomeRole")+": "+role)});
function openModal(title,desc,fields,kind){modalKind=kind;document.getElementById("modalTitle").textContent=title;document.getElementById("modalDesc").textContent=desc;document.getElementById("modalFields").innerHTML=fields;document.getElementById("modalBackdrop").classList.add("open")}
function closeModal(){document.getElementById("modalBackdrop").classList.remove("open")}
function openProductModal(){if(!allowed("products","c"))return notify(t("noPermission"));openModal(t("addProduct"),t("moduleInfo"),'<div class="field"><label>'+t("name")+'</label><input id="fName" required></div><div class="field"><label>'+t("category")+'</label><input id="fCategory" value="Ibiribwa"></div><div class="field"><label>'+t("quantity")+'</label><input id="fQty" type="number" min="0" value="1"></div><div class="field"><label>'+t("price")+' (RWF)</label><input id="fPrice" type="number" min="0" value="1000"></div><div class="field"><label>'+t("minimum")+'</label><input id="fMin" type="number" min="0" value="5"></div>',"product")}
function editProduct(id){if(!allowed("products","u"))return notify(t("noPermission"));let p=products.find(x=>x.id===id);openModal(t("update"),p.name,'<div class="field"><label>'+t("quantity")+'</label><input id="fQty" type="number" min="0" value="'+p.qty+'"></div><div class="field"><label>'+t("price")+'</label><input id="fPrice" type="number" value="'+p.price+'"></div>',"edit:"+id)}
function openMovementModal(out=false){if(!allowed("movements","c"))return notify(t("noPermission"));if(out&&role!=="Admin"&&role!=="Cashier")return notify(t("noPermission"));openModal(out?t("recordSale"):t("receiveStock"),t("moduleInfo"),'<div class="field"><label>'+t("product")+'</label><select id="fProduct">'+products.map(p=>'<option value="'+p.id+'">'+p.name+' ('+p.qty+')</option>').join("")+'</select></div><div class="field"><label>'+t("quantity")+'</label><input id="fQty" type="number" min="1" value="1"></div>',out?"out":"in")}
function openRequestModal(){if(!allowed("requests","c"))return notify(t("noPermission"));openModal(t("newRequest"),t("moduleInfo"),'<div class="field"><label>'+t("product")+'</label><select id="fProduct">'+products.map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join("")+'</select></div><div class="field"><label>'+t("quantity")+'</label><input id="fQty" type="number" min="1" value="5"></div>',"request")}
function saveModal(){let kind=modalKind;if(kind==="product"){let name=document.getElementById("fName").value.trim();if(!name)return notify(t("name"));let p={id:Math.max(0,...products.map(x=>x.id))+1,name,sku:"UB-"+String(products.length+1).padStart(3,"0"),category:document.getElementById("fCategory").value,qty:+document.getElementById("fQty").value,min:+document.getElementById("fMin").value,price:+document.getElementById("fPrice").value,icon:"📦"};products.push(p);recordAudit("Product created",name)}
else if(kind.startsWith("edit:")){let p=products.find(x=>x.id===+kind.split(":")[1]);p.qty=+document.getElementById("fQty").value;p.price=+document.getElementById("fPrice").value;recordAudit("Product updated",p.name)}
else if(kind==="in"||kind==="out"){let p=products.find(x=>x.id===+document.getElementById("fProduct").value),q=+document.getElementById("fQty").value;if(!q||q<1)return;if(kind==="out"&&p.qty<q)return notify(t("denied"));p.qty+=kind==="in"?q:-q;let id="MV-"+(1043+movements.length);movements.unshift({id,product:p.name,type:kind==="in"?"stockIn":"stockOut",qty:q,date:new Date().toISOString().slice(0,10),by:role});recordAudit(kind==="in"?"Stock received":"Stock issued",p.name+" "+q)}
else if(kind==="request"){let p=products.find(x=>x.id===+document.getElementById("fProduct").value),q=+document.getElementById("fQty").value;requests.unshift({id:"RQ-"+String(201+requests.length).padStart(4,"0"),product:p.name,qty:q,status:"pending",by:role});recordAudit("Request created",p.name)}
closeModal();render();notify(t("saved"))}
function approveRequest(id){if(role!=="Admin"&&role!=="Manager")return notify(t("noPermission"));let r=requests.find(x=>x.id===id);r.status="approved";recordAudit("Request approved",id);render();notify(t("saved"))}
function exportReport(){if(!allowed("reports"))return notify(t("noPermission"));let csv=["Product,SKU,Quantity,Minimum,Price"].concat(products.map(p=>[p.name,p.sku,p.qty,p.min,p.price].join(","))).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="ububiko-stock-report.csv";a.click();URL.revokeObjectURL(a.href);notify(t("exported"))}
render();
</script>
</body></html>
