services:
  - type: web
    name: ububiko-smart-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        value: https://genzura-ububiko-bwawe.vercel.app,https://genzura-ububiko-bwawe-*.vercel.app,https://genzura-ububiko-bwawe.onrender.com,https://ububikobwawe.netlify.app,https://*--ububikobwawe.netlify.app,http://127.0.0.1:5500,http://localhost:5500
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: OAUTH_CALLBACK_BASE
        value: https://genzura-ububiko-bwawe.onrender.com
      - key: OAUTH_ALLOW_SIGNUP
        value: "false"
      - key: OAUTH_DEFAULT_ROLE
        value: Storekeeper
